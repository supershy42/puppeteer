services:
  api_gateway:
    container_name: api_gateway
    init: true
    build:
      context: ./api_gateway
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    depends_on:
      user:
        condition: service_healthy
      game:
        condition: service_healthy
      chat:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  user:
    container_name: user
    init: true
    build:
      context: ./user
    env_file:
      - ./.env
      - ./user/.env
    environment:
      - POSTGRES_HOST=database_user
      - POSTGRES_USER=${DB_USER_USER}
      - POSTGRES_PASSWORD=${DB_USER_PASSWORD}
      - POSTGRES_DB=${DB_USER_NAME}
    depends_on:
      database_user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  chat:
    container_name: chat
    init: true
    build:
      context: ./chat
    env_file:
      - ./.env
      - ./chat/.env
    environment:
      - POSTGRES_HOST=database_chat
      - POSTGRES_USER=${DB_CHAT_USER}
      - POSTGRES_PASSWORD=${DB_CHAT_PASSWORD}
      - POSTGRES_DB=${DB_CHAT_NAME}
    depends_on:
      database_chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  game:
    container_name: game
    init: true
    build:
      context: ./game
    env_file:
      - ./.env
      - ./game/.env
    environment:
      - POSTGRES_HOST=database_game
      - POSTGRES_USER=${DB_GAME_USER}
      - POSTGRES_PASSWORD=${DB_GAME_PASSWORD}
      - POSTGRES_DB=${DB_GAME_NAME}
    depends_on:
      database_game:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  frontend:
    container_name: frontend
    init: true
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - backend

  database_user:
    container_name: database_user
    init: true
    build:
      context: ./database_user
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER_USER}
      - POSTGRES_PASSWORD=${DB_USER_PASSWORD}
      - POSTGRES_DB=${DB_USER_NAME}
    volumes:
      - db_user_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_USER} -d ${DB_USER_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  database_chat:
    container_name: database_chat
    init: true
    build:
      context: ./database_chat
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_CHAT_USER}
      - POSTGRES_PASSWORD=${DB_CHAT_PASSWORD}
      - POSTGRES_DB=${DB_CHAT_NAME}
    volumes:
      - db_chat_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_CHAT_USER} -d ${DB_CHAT_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  database_game:
    container_name: database_game
    init: true
    build:
      context: ./database_game
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_GAME_USER}
      - POSTGRES_PASSWORD=${DB_GAME_PASSWORD}
      - POSTGRES_DB=${DB_GAME_NAME}
    volumes:
      - db_game_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_GAME_USER} -d ${DB_GAME_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis_events:
    image: redis:7.4-alpine
    container_name: redis_events
    init: true
    restart: unless-stopped
    networks:
      - backend

  redis_websockets:
    image: redis:7.4-alpine
    container_name: redis_websockets
    init: true
    restart: unless-stopped
    networks:
      - backend

  dozzle:
    image: amir20/dozzle:v8.12.1
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - backend

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_chat_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_PATH}/chat
      o: bind

  db_game_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_PATH}/game
      o: bind

  db_user_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_PATH}/user
      o: bind

  redis_events_data:
    driver: local

  redis_websockets_data:
    driver: local
